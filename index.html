<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PREDICTION of SEA CONDITION AROUND WAKASA BAY by UCHI</title>

<style>
body {
  font-family: "Segoe UI", Arial, sans-serif;
  background-color: #f8f9fa;
  margin: 0;
  text-align: center;
}
header {
  background: linear-gradient(90deg, #004e92, #000428);
  color: white;
  padding: 1.2rem;
  font-size: 1.4rem;
  font-weight: bold;
}
#wholeArea img {
  width: 75%;
  max-width: 800px;
  border: 2px solid #ccc;
  border-radius: 10px;
}
.container {
  margin: 1.5rem auto;
  width: 95%;
  max-width: 900px;
}
select, button {
  margin: 0.4rem;
  padding: 0.5rem;
  font-size: 1rem;
}
img, video {
  width: 100%;
  max-height: 80vh;
  border: 2px solid #ccc;
  border-radius: 10px;
  background: white;
}
.btn-group {
  display: flex;
  justify-content: center;
  gap: 1rem;
  margin-top: 0.8rem;
}
#mode-buttons button {
  background-color: #007bff;
  color: white;
  border: none;
  border-radius: 6px;
  padding: 0.6rem 1rem;
  cursor: pointer;
}
#mode-buttons button.active {
  background-color: #0056b3;
}

/* お気に入り */
#favoritePanel {
  background: #eef2f7;
  border-radius: 8px;
  padding: 0.8rem;
  margin-top: 1rem;
}
#favoritePanel button {
  background-color: #ffc107;
  border: none;
  border-radius: 6px;
  cursor: pointer;
}
</style>
</head>

<body>

<header>
PREDICTION of <br>&emsp;SEA CONDITION by UCHI <br>&emsp;&emsp;AROUND WAKASA BAY
</header>

<div id="wholeArea">
  <img src="images/WholeArea.png">
</div>

<div class="container">

<!-- モード -->
<div id="mode-buttons">
  <button id="imageModeBtn" class="active">静止画</button>
  <button id="videoModeBtn">動画</button>
</div>

<!-- ===== お気に入り ===== -->
<div id="favoritePanel">
  <strong>お気に入り設計</strong><br>
  <select id="favoriteSelect"></select>
  <button onclick="applyFavorite()">適用</button>
  <button onclick="deleteFavorite()">削除</button>
  <br>
  <button onclick="saveFavorite()">★ 現在の表示を保存</button>
</div>

<!-- ===== 静止画 ===== -->
<div id="imageMode">
  <div>
    エリア：
    <select id="zoomArea"></select><br>
    項目：
    <select id="imageVar">
      <option value="SVel">10m-Current</option>
      <option value="BVel">30m-Current</option>
      <option value="SSS">10m-Salinity</option>
      <option value="BS">30m-Salinity</option>
      <option value="SST">10m-Temperature</option>
      <option value="BT">30m-Temperature</option>
    </select><br>
    日時：
    <select id="imageTime"></select>
  </div>

  <div class="btn-group">
    <button onclick="shiftImage(-1)">PREV</button>
    <button onclick="shiftImage(1)">NEXT</button>
  </div>

  <img id="displayImage">
</div>

<!-- ===== 動画 ===== -->
<div id="videoMode" style="display:none;">
  <div>
    エリア：
    <select id="zoomAreaVideo"></select><br>
    項目：
    <select id="videoVar">
      <option value="SVel">10m-Current</option>
      <option value="BVel">30m-Current</option>
      <option value="SSS">10m-Salinity</option>
      <option value="BS">30m-Salinity</option>
      <option value="SST">10m-Temperature</option>
      <option value="BT">30m-Temperature</option>
    </select>
  </div>
  <video id="displayVideo" controls></video>
</div>

</div>

<script>
let imageData={}, videoData={};

/* ===== LocalStorage FAVORITE ===== */
const FAVORITE_KEY = "UCHI_FAVORITES";

function loadFavorites(){
  return JSON.parse(localStorage.getItem(FAVORITE_KEY) || "{}");
}
function saveFavorites(obj){
  localStorage.setItem(FAVORITE_KEY, JSON.stringify(obj));
  updateFavoriteSelect();
}

function updateFavoriteSelect(){
  const sel = favoriteSelect;
  sel.innerHTML="";
  const fav = loadFavorites();
  Object.keys(fav).forEach(k=>{
    const o=document.createElement("option");
    o.value=k; o.textContent=k;
    sel.appendChild(o);
  });
}

function saveFavorite(){
  const name = prompt("お気に入り名を入力してください");
  if(!name) return;
  const fav = loadFavorites();

  fav[name] = imageMode.style.display!=="none" ? {
    mode:"image",
    area:zoomArea.value,
    var:imageVar.value,
    time:imageTime.value
  } : {
    mode:"video",
    area:zoomAreaVideo.value,
    var:videoVar.value
  };
  saveFavorites(fav);
}

function applyFavorite(){
  const fav = loadFavorites()[favoriteSelect.value];
  if(!fav) return;

  if(fav.mode==="image"){
    imageModeBtn.click();
    zoomArea.value=fav.area;
    imageVar.value=fav.var;
    populateTimeOptions();
    imageTime.value=fav.time;
    updateImage();
  }else{
    videoModeBtn.click();
    zoomAreaVideo.value=fav.area;
    videoVar.value=fav.var;
    updateVideo();
  }
}

function deleteFavorite(){
  const fav = loadFavorites();
  delete fav[favoriteSelect.value];
  saveFavorites(fav);
}

/* ===== 既存処理（最小限） ===== */
async function loadJSON(){
  imageData = await (await fetch("image_list.json",{cache:"no-store"})).json();
  videoData = await (await fetch("video_list.json",{cache:"no-store"})).json();
  populateZoomOptions();
  updateFavoriteSelect();
}
function populateZoomOptions(){
  zoomArea.innerHTML="";
  Object.keys(imageData).forEach(a=>{
    zoomArea.innerHTML+=`<option>${a}</option>`;
  });
  zoomAreaVideo.innerHTML=zoomArea.innerHTML;
  populateTimeOptions();
}
function populateTimeOptions(){
  const arr=imageData[zoomArea.value][imageVar.value];
  imageTime.innerHTML="";
  arr.forEach(e=>{
    imageTime.innerHTML+=`<option value="${e.path}">${e.datetime}</option>`;
  });
  updateImage();
}
function updateImage(){ displayImage.src=imageTime.value; }
function updateVideo(){
  displayVideo.src=videoData[zoomAreaVideo.value][videoVar.value][0].path;
}
function shiftImage(d){
  imageTime.selectedIndex+=d;
  updateImage();
}

imageVar.onchange=populateTimeOptions;
zoomArea.onchange=populateTimeOptions;
imageTime.onchange=updateImage;
videoVar.onchange=updateVideo;
zoomAreaVideo.onchange=updateVideo;

imageModeBtn.onclick=()=>{
  imageMode.style.display="block";videoMode.style.display="none";
};
videoModeBtn.onclick=()=>{
  imageMode.style.display="none";videoMode.style.display="block";
};

window.onload=loadJSON;
</script>

</body>
</html>
