<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PREDICTION of SEA CONDITION AROUND WAKASA BAY by UCHI</title>

<style>
body {
  font-family: "Segoe UI", Arial, sans-serif;
  background-color: #f8f9fa;
  margin: 0;
  text-align: center;
}
header {
  background: linear-gradient(90deg, #004e92, #000428);
  color: white;
  padding: 1.2rem;
  font-size: 1.4rem;
  font-weight: bold;
}

#wholeArea {
  display: flex;
  justify-content: center;
  margin: 1rem 0;
}
#wholeArea img {
  width: 75%;
  max-width: 800px;
  border: 2px solid #ccc;
  border-radius: 10px;
}

/* ===== お気に入りページ ===== */
#favoritePage {
  max-width: 900px;
  margin: 0 auto 1.5rem auto;
  background: #fffbe6;
  border: 2px solid #f0c000;
  border-radius: 10px;
  padding: 1rem;
}
.favorite-item {
  margin: 0.4rem 0;
}
.favorite-item button {
  margin-left: 0.5rem;
}
.favorite-note {
  margin-top: 0.8rem;
  font-size: 0.85rem;
  color: #555;
}

/* ===== 共通 ===== */
.container {
  margin: 1.5rem auto;
  width: 95%;
  max-width: 900px;
}
select, button, input {
  margin: 0.4rem;
  padding: 0.4rem;
  font-size: 1rem;
}
img, video {
  width: 100%;
  max-height: 80vh;
  border: 2px solid #ccc;
  border-radius: 10px;
  background: white;
}
.btn-group {
  display: flex;
  justify-content: center;
  gap: 1rem;
  margin-top: 0.8rem;
}
#mode-buttons button {
  background-color: #007bff;
  color: white;
  border: none;
  border-radius: 6px;
  padding: 0.6rem 1rem;
  cursor: pointer;
}
#mode-buttons button.active {
  background-color: #0056b3;
}

/* ===== 速度注記 ===== */
.velocity-note {
  margin-top: 0.4rem;
  font-size: 0.9rem;
  color: #c00000;
  font-weight: bold;
  display: none;
}

/* ===== 位置表示用 ===== */
.map-wrapper {
  position: relative;
}
.overlay-canvas {
  position: absolute;
  inset: 0;
  pointer-events: none;
}

/* ===== フッター ===== */
footer {
  margin-top: 2rem;
  background-color: #e9ecef;
  color: #555;
  font-size: 0.9rem;
  padding: 0.8rem;
  border-top: 1px solid #ccc;
}
#contactBtn {
  background-color: #007bff;
  color: white;
  padding: 0.5rem 1rem;
  border-radius: 6px;
  text-decoration: none;
}

/* ===== 削除確認モーダル ===== */
#deleteModal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.4);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 9999;
}
#deleteModalContent {
  background: white;
  padding: 1.2rem;
  border-radius: 8px;
  width: 90%;
  max-width: 360px;
}
#deleteModalContent p {
  margin-bottom: 1rem;
}
</style>
</head>

<body>
<header>PREDICTION of <br>&nbsp;SEA CONDITION by UCHI<br>&nbsp;&nbsp;AROUND WAKASA BAY</header>

<div id="wholeArea">
  <img src="images/WholeArea.png">
</div>

<div id="favoritePage">
  <h3> お気に入りページ </h3>
  <div id="favoritePageList"></div>
  <div class="favorite-note">
    静止画/動画・エリア・項目を選択後、最下部の設計名を記入して、お気に入り登録
  </div>
</div>

<div class="container">

<div>
  <label>
    <input type="checkbox" id="locationToggle">
    現在地・方位を表示
  </label>
</div>

<div id="mode-buttons">
  <button id="imageModeBtn" class="active">静止画</button>
  <button id="videoModeBtn">動画</button>
</div>

<!-- ================= 静止画 ================= -->
<div id="imageMode">
  <label>エリア：</label>
  <select id="zoomArea"></select><br>

  <label>項目：</label>
  <select id="imageVar">
    <option value="SVel">10m-Current</option>
    <option value="BVel">30m-Current</option>
    <option value="SST">10m-Temperature</option>
    <option value="BT">30m-Temperature</option>
    <option value="SSS">10m-Salinity</option>
    <option value="BS">30m-Salinity</option>
  </select><br>

  <label>日時：</label>
  <select id="imageTime"></select>

  <div class="btn-group">
    <button id="prevBtn">PREV</button>
    <button id="nextBtn">NEXT</button>
  </div>

  <div class="map-wrapper">
    <img id="displayImage">
    <canvas id="imageCanvas" class="overlay-canvas"></canvas>
  </div>

  <div id="imageVelocityNote" class="velocity-note">
    赤矢印は流速0.5m/s以上
  </div>
</div>

<!-- ================= 動画 ================= -->
<div id="videoMode" style="display:none;">
  <label>エリア：</label>
  <select id="zoomAreaVideo"></select><br>

  <label>項目：</label>
  <select id="videoVar">
    <option value="SVel">10m-Current</option>
    <option value="BVel">30m-Current</option>
    <option value="SST">10m-Temperature</option>
    <option value="BT">30m-Temperature</option>
    <option value="SSS">10m-Salinity</option>
    <option value="BS">30m-Salinity</option>
  </select>

  <div class="map-wrapper">
    <video id="displayVideo" controls></video>
    <canvas id="videoCanvas" class="overlay-canvas"></canvas>
  </div>

  <div id="videoVelocityNote" class="velocity-note">
    赤矢印は流速0.5m/s以上
  </div>
</div>

</div>

<footer>
<p>当予測結果は九州大学総合理工学研究院によるものです。</p>
<a id="contactBtn" href="#">開発者へのお問い合わせはこちら</a>
</footer>

<script>
/* ===== エリアごとの緯度経度範囲（編集可） ===== */
const AREA_BOUNDS = {
  "WholeArea": {latMin:35.306869, latMax:36.5, lonMin:134.344906, lonMax:136.511917}
  "Area1": {latMin:35.506927, latMax:36.087634, lonMin:134.542967, lonMax:135.198202}
  "Area2": {latMin:35.32, latMax:36.035958, lonMin:134.894557, lonMax:135.559380}
  "Area3": {latMin:35.33, latMax:36.245939, lonMin:135.057566, lonMax:136.125013}
};
  
/* ===== 表示設定 ===== */
const MARKER_RADIUS = 8;
const DIRECTION_LENGTH = 30;

let currentLat = null;
let currentLon = null;
let currentHeading = 0;

/* ===== 位置取得 ===== */
navigator.geolocation?.watchPosition(p=>{
  currentLat = p.coords.latitude;
  currentLon = p.coords.longitude;
},{}, {enableHighAccuracy:true});

/* ===== 方位取得 ===== */
window.addEventListener("deviceorientation", e=>{
  if(e.alpha !== null) currentHeading = e.alpha;
});

/* ===== 描画 ===== */
function drawOverlay(canvas, area){
  const ctx = canvas.getContext("2d");
  canvas.width = canvas.clientWidth;
  canvas.height = canvas.clientHeight;
  ctx.clearRect(0,0,canvas.width,canvas.height);

  if(!locationToggle.checked || currentLat===null) return;

  const b = AREA_BOUNDS[area];
  if(!b) return;

  const x = (currentLon - b.lonMin)/(b.lonMax-b.lonMin)*canvas.width;
  const y = (b.latMax - currentLat)/(b.latMax-b.latMin)*canvas.height;

  ctx.beginPath();
  ctx.arc(x,y,MARKER_RADIUS,0,Math.PI*2);
  ctx.fillStyle="yellow";
  ctx.fill();
  ctx.strokeStyle="black";
  ctx.stroke();

  const rad = currentHeading*Math.PI/180;
  ctx.beginPath();
  ctx.moveTo(x,y);
  ctx.lineTo(x+Math.sin(rad)*DIRECTION_LENGTH, y-Math.cos(rad)*DIRECTION_LENGTH);
  ctx.strokeStyle="black";
  ctx.lineWidth=2;
  ctx.stroke();
}

/* ===== ループ ===== */
setInterval(()=>{
  drawOverlay(imageCanvas, zoomArea.value);
  drawOverlay(videoCanvas, zoomAreaVideo.value);
},500);
</script>
</body>
</html>
