<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PREDICTION of SEA CONDITION AROUND WAKASA BAY by UCHI</title>

<style>
body {
  font-family: "Segoe UI", Arial, sans-serif;
  background-color: #f8f9fa;
  margin: 0;
  text-align: center;
}
header {
  background: linear-gradient(90deg, #004e92, #000428);
  color: white;
  padding: 1.2rem;
  font-size: 1.4rem;
  font-weight: bold;
}

#wholeArea {
  display: flex;
  justify-content: center;
  margin: 1rem 0;
}
#wholeArea img {
  width: 75%;
  max-width: 800px;
  border: 2px solid #ccc;
  border-radius: 10px;
}

/* ===== お気に入りページ ===== */
#favoritePage {
  max-width: 900px;
  margin: 0 auto 1.5rem auto;
  background: #fffbe6;
  border: 2px solid #f0c000;
  border-radius: 10px;
  padding: 1rem;
}
.favorite-item {
  margin: 0.4rem 0;
}
.favorite-item button {
  margin-left: 0.5rem;
}
.favorite-note {
  margin-top: 0.8rem;
  font-size: 0.85rem;
  color: #555;
}

/* ===== 共通 ===== */
.container {
  margin: 1.5rem auto;
  width: 95%;
  max-width: 900px;
}
select, button, input {
  margin: 0.4rem;
  padding: 0.4rem;
  font-size: 1rem;
}
img, video {
  width: 100%;
  max-height: 80vh;
  border: 2px solid #ccc;
  border-radius: 10px;
  background: white;
}
.btn-group {
  display: flex;
  justify-content: center;
  gap: 1rem;
  margin-top: 0.8rem;
}
#mode-buttons button {
  background-color: #007bff;
  color: white;
  border: none;
  border-radius: 6px;
  padding: 0.6rem 1rem;
  cursor: pointer;
}
#mode-buttons button.active {
  background-color: #0056b3;
}

/* ===== 速度注記 ===== */
.velocity-note {
  margin-top: 0.4rem;
  font-size: 0.9rem;
  color: #c00000;
  font-weight: bold;
  display: none;
}

/* ===== 現在地マーカー ===== */
:root {
  --marker-size: 16px;
  --arrow-length: 28px;
}

.image-wrapper {
  position: relative;
}

#positionOverlay {
  position: absolute;
  inset: 0;
  pointer-events: none;
}

#positionMarker {
  position: absolute;
  width: var(--marker-size);
  height: var(--marker-size);
  background: yellow;
  border: 2px solid black;
  border-radius: 50%;
  transform: translate(-50%, -50%);
}

#directionArrow {
  position: absolute;
  width: 2px;
  height: var(--arrow-length);
  background: black;
  transform-origin: bottom center;
}

/* ===== フッター ===== */
footer {
  margin-top: 2rem;
  background-color: #e9ecef;
  color: #555;
  font-size: 0.9rem;
  padding: 0.8rem;
  border-top: 1px solid #ccc;
}
#contactBtn {
  background-color: #007bff;
  color: white;
  padding: 0.5rem 1rem;
  border-radius: 6px;
  text-decoration: none;
}

/* ===== 削除確認モーダル ===== */
#deleteModal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.4);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 9999;
}
#deleteModalContent {
  background: white;
  padding: 1.2rem;
  border-radius: 8px;
  width: 90%;
  max-width: 360px;
}
#deleteModalContent p {
  margin-bottom: 1rem;
}
</style>
</head>

<body>
<header>PREDICTION of <br>&nbsp;SEA CONDITION by UCHI<br>&nbsp;&nbsp;AROUND WAKASA BAY</header>

<div id="wholeArea">
  <img src="images/WholeArea.png">
</div>

<div id="favoritePage">
  <h3> お気に入りページ </h3>
  <div id="favoritePageList"></div>
  <div class="favorite-note">
    静止画/動画・エリア・項目を選択後、最下部の設計名を記入して、お気に入り登録ボタンを押すと、ここに登録されます(複数登録可)
  </div>
</div>

<div class="container">

<div id="mode-buttons">
  <button id="imageModeBtn" class="active">静止画</button>
  <button id="videoModeBtn">動画</button>
</div>

<!-- ================= 静止画 ================= -->
<div id="imageMode">
  <label>エリア：</label>
  <select id="zoomArea"></select><br>

  <label>項目：</label>
  <select id="imageVar">
    <option value="SVel">10m-Current</option>
    <option value="BVel">30m-Current</option>
    <option value="SST">10m-Temperature</option>
    <option value="BT">30m-Temperature</option>
    <option value="SSS">10m-Salinity</option>
    <option value="BS">30m-Salinity</option>
  </select><br>

  <label>日時：</label>
  <select id="imageTime"></select>

  <div class="btn-group">
    <button id="prevBtn">PREV</button>
    <button id="nextBtn">NEXT</button>
  </div>

  <div class="image-wrapper">
    <img id="displayImage">
    <div id="positionOverlay">
      <div id="positionMarker"></div>
      <div id="directionArrow"></div>
    </div>
  </div>

  <div id="imageVelocityNote" class="velocity-note">
    赤矢印は流速0.5m/s以上
  </div>

  <div>
    <input id="favNameImage" placeholder="設計名">
    <button onclick="saveFavorite('image')">お気に入り登録</button>
  </div>
</div>

<!-- ================= 動画 ================= -->
<div id="videoMode" style="display:none;">
  <label>エリア：</label>
  <select id="zoomAreaVideo"></select><br>

  <label>項目：</label>
  <select id="videoVar">
    <option value="SVel">10m-Current</option>
    <option value="BVel">30m-Current</option>
    <option value="SST">10m-Temperature</option>
    <option value="BT">30m-Temperature</option>
    <option value="SSS">10m-Salinity</option>
    <option value="BS">30m-Salinity</option>
  </select>

  <video id="displayVideo" controls></video>

  <div id="videoVelocityNote" class="velocity-note">
    赤矢印は流速0.5m/s以上
  </div>

  <div>
    <input id="favNameVideo" placeholder="設計名">
    <button onclick="saveFavorite('video')">お気に入り登録</button>
  </div>
</div>

</div>

<footer>
<p>当予測結果は九州大学総合理工学研究院によるものです。使用することによって発生した一切の損害について、何等責任を負いません。</p>
<a id="contactBtn" href="#">開発者へのお問い合わせはこちら</a>
</footer>

<div id="deleteModal">
  <div id="deleteModalContent">
    <p>このお気に入りを削除してもよろしいですか？</p>
    <button onclick="confirmDelete()">削除</button>
    <button onclick="closeDeleteModal()">キャンセル</button>
  </div>
</div>

<script>
/* ===== 静止画の緯度経度定義 ===== */
const IMAGE_LATLON = {
  lat_top: 34.50,
  lon_left: 129.50,
  lat_bottom: 32.60,
  lon_right: 131.2
};

function updateMarker(lat, lon) {
  const img = displayImage;
  const rect = img.getBoundingClientRect();

  const x = (lon - IMAGE_LATLON.lon_left) /
            (IMAGE_LATLON.lon_right - IMAGE_LATLON.lon_left) * rect.width;
  const y = (IMAGE_LATLON.lat_top - lat) /
            (IMAGE_LATLON.lat_top - IMAGE_LATLON.lat_bottom) * rect.height;

  positionMarker.style.left = x + "px";
  positionMarker.style.top = y + "px";
  directionArrow.style.left = x + "px";
  directionArrow.style.top = y + "px";
}

navigator.geolocation.watchPosition(pos=>{
  updateMarker(pos.coords.latitude, pos.coords.longitude);
});

window.addEventListener("deviceorientation", e=>{
  if(e.alpha != null){
    directionArrow.style.transform = `rotate(${e.alpha}deg) translateY(-100%)`;
  }
});
</script>

</body>
</html>
