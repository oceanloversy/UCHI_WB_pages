<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PREDICTION of SEA CONDITION AROUND WAKASA BAY by UCHI</title>

<style>
body {
  font-family: "Segoe UI", Arial, sans-serif;
  background-color: #f8f9fa;
  margin: 0;
  text-align: center;
}
header {
  background: linear-gradient(90deg, #004e92, #000428);
  color: white;
  padding: 1.2rem;
  font-size: 1.4rem;
  font-weight: bold;
}

#wholeArea {
  display: flex;
  justify-content: center;
  margin: 1rem 0;
}
#wholeArea img {
  width: 75%;
  max-width: 800px;
  border: 2px solid #ccc;
  border-radius: 10px;
}

/* ===== お気に入りページ ===== */
#favoritePage {
  max-width: 900px;
  margin: 0 auto 1.5rem auto;
  background: #fffbe6;
  border: 2px solid #f0c000;
  border-radius: 10px;
  padding: 1rem;
}
.favorite-item {
  margin: 0.4rem 0;
}
.favorite-item button {
  margin-left: 0.5rem;
}
.favorite-note {
  margin-top: 0.8rem;
  font-size: 0.85rem;
  color: #555;
}

/* ===== 共通 ===== */
.container {
  margin: 1.5rem auto;
  width: 95%;
  max-width: 900px;
}
select, button, input {
  margin: 0.4rem;
  padding: 0.4rem;
  font-size: 1rem;
}
img, video {
  width: 100%;
  max-height: 80vh;
  border: 2px solid #ccc;
  border-radius: 10px;
  background: white;
}

  /* === ADD: カラーバー専用 === */
.colorbar {
  width: 100%;
  max-width: 900px;
  margin: 0.4rem auto 0.2rem auto;
  border: none;
  background: transparent;
}
.btn-group {
  display: flex;
  justify-content: center;
  gap: 1rem;
  margin-top: 0.8rem;
}
#mode-buttons button {
  background-color: #007bff;
  color: white;
  border: none;
  border-radius: 6px;
  padding: 0.6rem 1rem;
  cursor: pointer;
}
#mode-buttons button.active {
  background-color: #0056b3;
}

/* ===== 速度注記 ===== */
.velocity-note {
  margin-top: 0.4rem;
  font-size: 0.9rem;
  color: #c00000;
  font-weight: bold;
  display: none;
}

/* ===== 現在地マーカー ===== */
:root {
  --marker-size: 10px;
  --arrow-length: 10px;
}
.image-wrapper {
  position: relative;
  width: 100%;
}
#displayImage {
  display: block;
}
#positionOverlay {
  position: absolute;
  top: 0;
  left: 0;
}
 
#positionMarker {
  position: absolute;
  width: var(--marker-size);
  height: var(--marker-size);
  background: yellow;
  border: 2px solid black;
  border-radius: 50%;
  transform: translate(-50%, -50%);
}
/* ===== 矢印（円周に沿う） ===== */
#directionArrow {
  position: absolute;
  width: 0;
  height: 0;
  transform-origin: center center;
}

/* 矢印の軸 */
#directionArrow::before {
  content: "";
  position: absolute;
  left: -1px;
  top: calc(-1 * (var(--marker-size) / 2 + var(--arrow-length)));
  width: 2px;
  height: var(--arrow-length);
  background: black;
}

/* 矢印のヘッド */
#directionArrow::after {
  content: "";
  position: absolute;
  left: -6px;
  top: calc(-1 * (var(--marker-size) / 2 + var(--arrow-length) + 6px));
  border-left: 6px solid transparent;
  border-right: 6px solid transparent;
  border-bottom: 6px solid black;
}

/* ===== フッター ===== */
footer {
  margin-top: 2rem;
  background-color: #e9ecef;
  color: #555;
  font-size: 0.9rem;
  padding: 0.8rem;
  border-top: 1px solid #ccc;
}
#contactBtn {
  background-color: #007bff;
  color: white;
  padding: 0.5rem 1rem;
  border-radius: 6px;
  text-decoration: none;
}

/* ===== 削除確認モーダル ===== */
#deleteModal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.4);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 9999;
}
#deleteModalContent {
  background: white;
  padding: 1.2rem;
  border-radius: 8px;
  width: 90%;
  max-width: 360px;
}
#deleteModalContent p {
  margin-bottom: 1rem;
}
</style>
</head>

<body>
<header>PREDICTION of <br>&nbsp;SEA CONDITION by UCHI<br>&nbsp;&nbsp;AROUND WAKASA BAY</header>

<div id="wholeArea">
  <img src="images/WholeArea.png">
</div>

<div id="favoritePage">
  <h3> お気に入りページ </h3>
  <div id="favoritePageList"></div>
  <div class="favorite-note">
    静止画/動画・エリア・項目を選択後、最下部の登録名を記入して、お気に入り登録ボタンを押すと、ここに登録されます(複数登録可)
  </div>
</div>

<div class="container">

<div id="mode-buttons">
  <button id="imageModeBtn" class="active">静止画</button>
  <button id="videoModeBtn">動画</button>
</div>

<!-- ===== 矢印ON/OFF切替（追加） ===== -->
<div style="margin-bottom:0.5rem;">
  <label>
    <input type="checkbox" id="togglePosition" checked>
    現在地・方位を表示
  </label>
</div>

<!-- ================= 静止画 ================= -->
<div id="imageMode">
  <label>エリア：</label>
  <select id="zoomArea"></select><br>

  <label>項目：</label>
  <select id="imageVar">
    <option value="SVel">10m-Current</option>
    <option value="BVel">30m-Current</option>
    <option value="SST">10m-Temperature</option>
    <option value="BT">30m-Temperature</option>
    <option value="SSS">10m-Salinity</option>
    <option value="BS">30m-Salinity</option>
  </select><br>

  <label>日時：</label>
  <select id="imageTime"></select>

  <div class="btn-group">
    <button id="prevBtn">PREV</button>
    <button id="nextBtn">NEXT</button>
  </div>

 <!-- ★ ADD: 現在時刻ON/OFF -->
  <div style="margin-top:0.4rem;">
    <label>
      <input type="checkbox" id="autoNowToggle">
      直近結果表示 ON
    </label>
  </div>

 
  <div class="image-wrapper">
    <img id="displayImage">
    <div id="positionOverlay">
      <div id="positionMarker"></div>
      <div id="directionArrow"></div>
    </div>
  </div>

　  <!-- === ADD: 静止画カラーバー === -->
  <img id="imageColorbar" class="colorbar" src="">
 
  <div id="imageVelocityNote" class="velocity-note">
    赤矢印は流速0.5m/s以上
  </div>

  <div>
    <input id="favNameImage" placeholder="登録名">
    <button onclick="saveFavorite('image')">お気に入り登録</button>
  </div>
</div>

<!-- ================= 動画 ================= -->
<div id="videoMode" style="display:none;">
  <label>エリア：</label>
  <select id="zoomAreaVideo"></select><br>

  <label>項目：</label>
  <select id="videoVar">
    <option value="SVel">10m-Current</option>
    <option value="BVel">30m-Current</option>
    <option value="SST">10m-Temperature</option>
    <option value="BT">30m-Temperature</option>
    <option value="SSS">10m-Salinity</option>
    <option value="BS">30m-Salinity</option>
  </select>

  <video id="displayVideo" controls></video>

  <!-- === ADD: 動画カラーバー === -->
  <img id="videoColorbar" class="colorbar" src="">

  <div id="videoVelocityNote" class="velocity-note">
    赤矢印は流速0.5m/s以上
  </div>

  <div>
    <input id="favNameVideo" placeholder="登録名">
    <button onclick="saveFavorite('video')">お気に入り登録</button>
  </div>
</div>

</div>

<footer>
<p>予測結果は九州大学総合理工学研究院によるものです。予測使用により発生した損害について、何等責任を負いません。ご了承の上、ご使用ください。</p>
<a id="contactBtn" href="#">開発者へ問い合わせメール</a>
</footer>

<div id="deleteModal">
  <div id="deleteModalContent">
    <p>このお気に入りを削除してもよろしいですか？</p>
    <button onclick="confirmDelete()">削除</button>
    <button onclick="closeDeleteModal()">キャンセル</button>
  </div>
</div>

<script>
let currentHeading = 0; // 方位角（deg）

/* ================== 追加変数（最小） ================== */
let lastLat = null;
let lastLon = null;
let imageLoaded = false;

/* ================== データ ================== */
let imageData = {}, videoData = {};
let autoNow = false; // ★ ADD

const SITE_ID = "Wakasa Bay";   // ← 海域ごとに必ず変更
const FAV_KEY = `uchi_favorites_${SITE_ID}`;
let deleteTargetName = null;

/* ===== 静止画のエリア別緯度経度範囲（手動調整可） ===== */
const AREA_LATLON = {
  "Area1": { lat_top:36.087634, lat_bottom:35.506927, lon_left:134.542967, lon_right:135.198202 },
  "Area2": { lat_top:36.035958, lat_bottom:35.32, lon_left:134.894557, lon_right:135.559380 },
  "Area3": { lat_top:36.245939, lat_bottom:35.33, lon_left:135.057566, lon_right:136.125013 },
  "WholeArea": { lat_top:36.5, lat_bottom:35.306869, lon_left:134.344906, lon_right:136.511917 }
  // 必要に応じて追加
};

function resetAutoNow(){
  autoNow = false;
  autoNowToggle.checked = false;
}

/* ===== 現在のエリア範囲取得 ===== */
function getCurrentLatLonRange(){
  const area = zoomArea ? zoomArea.value : null;
  return AREA_LATLON[area] || Object.values(AREA_LATLON)[0];
}
/* ===== 範囲判定 ===== */
function isInside(lat, lon){
  const r = getCurrentLatLonRange();
  return (
    lat <= r.lat_top &&
    lat >= r.lat_bottom &&
    lon >= r.lon_left &&
    lon <= r.lon_right
  );
}
/* ================== 初期化 ================== */
async function loadJSON(){
  imageData = await (await fetch("image_list.json",{cache:"no-store"})).json();
  videoData = await (await fetch("video_list.json",{cache:"no-store"})).json();
  initUI();
}

function initUI(){
/*  zoomArea.innerHTML = zoomAreaVideo.innerHTML =
  Object.keys(imageData).map(a=>`<option>${a}</option>`).join(""); */

  const opts = Object.keys(imageData).map(a=>`<option>${a}</option>`).join("");

  zoomArea.innerHTML = opts;
  zoomAreaVideo.innerHTML = opts;

/* ★★★ 追加：初期選択を明示的に確定 ★★★ */
　zoomArea.selectedIndex = 0;
　imageVar.selectedIndex = 0;
 
  populateTime();

  // ★ 初期カラーバー設定
  updateColorbar("image", imageVar.value);
  updateColorbar("video", videoVar.value);

  // ★ 初期速度注記制御
  toggleVelocityNote("image", imageVar.value);
  toggleVelocityNote("video", videoVar.value);

  renderFavorites();
  displayImage.src = imageTime.value;  // ★ 明示的に再代入
}

/* ================== JST を明示的に Date 化 ================== */
function parseJSTDate(str){
  // "2025/12/25 01:00" を想定
  const [datePart, timePart] = str.split(" ");
  const [y, m, d] = datePart.split("/").map(Number);
  const [hh, mm] = timePart.split(":").map(Number);

  // ローカルタイム（JST）として生成
  return new Date(y, m - 1, d, hh, mm, 0);
}


/* ================== 静止画 ================== */
function toggleVelocityNote(mode, v){
  const show = (v==="SVel"||v==="BVel");
  if(mode==="image") imageVelocityNote.style.display = show?"block":"none";
  else videoVelocityNote.style.display = show?"block":"none";
}

function populateTime(){
  imageLoaded = false;   // ← 重要
  const a = zoomArea.value;
  const v = imageVar.value;
  imageTime.innerHTML = "";
  imageData[a][v].forEach(e=>{
    imageTime.innerHTML += `<option value="${e.path}">${e.datetime}</option>`;
  });
  // ★ ADD: アクセス時刻に最も近い分布を初期選択
  autoNowToggle.onchange = () => {
    autoNow = autoNowToggle.checked;
    if(autoNow){
      selectNearestToDeviceTime(zoomArea.value, imageVar.value);
    }
  };

 
  displayImage.src = imageTime.value;
}

/* ★ ADD: 端末時刻（JST）に最も近いものを選択 */
function selectNearestToDeviceTime(area, variable){
  const now = new Date();   // 端末の現在時刻（JST）
  let minDiff = Infinity;
  let nearestIndex = 0;

  imageData[area][variable].forEach((e, i) => {
    const t = parseJSTDate(e.datetime);
    const diff = Math.abs(now.getTime() - t.getTime());

    if (diff < minDiff) {
      minDiff = diff;
      nearestIndex = i;
    }
  });

  imageTime.selectedIndex = nearestIndex;
  displayImage.src = imageTime.value;
}


prevBtn.onclick=()=>shift(-1);
nextBtn.onclick=()=>shift(1);

function shift(d){
  const i=imageTime.selectedIndex+d;
  if(i>=0 && i<imageTime.options.length){
    imageTime.selectedIndex=i;
    displayImage.src=imageTime.value;
  }
}

/* imageVar.onchange=populateTime; */
zoomArea.onchange = () => {
  resetAutoNow();     // ★ 追加
  populateTime();
  if(lastLat !== null && lastLon !== null){
    imageLoaded = false;
  }
};

imageVar.onchange = populateTime;
imageTime.onchange = ()=> {
  displayImage.src = imageTime.value;
};

/* ★ ADD: 現在時刻ON/OFF */
autoNowToggle.onchange = ()=>{
  autoNow = autoNowToggle.checked;
  if(autoNow){
    populateTime();
  }
};
/* ================== 動画 ================== */
function updateVideo(){
  const a=zoomAreaVideo.value,v=videoVar.value;
  displayVideo.src=videoData[a][v][0].path;
  toggleVelocityNote("video",v);

  // ★ 動画カラーバー更新
  updateColorbar("video", v);
}

videoVar.onchange=updateVideo;
zoomAreaVideo.onchange=updateVideo;

/* ================== モード ================== */
imageModeBtn.onclick=()=>{
  imageMode.style.display="block";
  videoMode.style.display="none";
  imageModeBtn.classList.add("active");
  videoModeBtn.classList.remove("active");
};
videoModeBtn.onclick=()=>{
  imageMode.style.display="none";
  videoMode.style.display="block";
  videoModeBtn.classList.add("active");
  imageModeBtn.classList.remove("active");
};

/* === ADD: カラーバー切替関数（既存処理に影響なし） === */
function updateColorbar(mode, v){
  const img = (mode === "image") ? imageColorbar : videoColorbar;
  img.src = `images/colorbar/${v}_colorbar.png`;
}

/* 既存 onchange に追記 */
imageVar.onchange = () => {
  resetAutoNow();     // ★ 追加
  populateTime();
  updateColorbar("image", imageVar.value);
  toggleVelocityNote("image", imageVar.value);
};


videoVar.onchange = () => {
  updateVideo();
  updateColorbar("video", videoVar.value);
};

/* ================== お気に入り ================== */
function getFav(){return JSON.parse(localStorage.getItem(FAV_KEY)||"{}");}
function saveFav(o){localStorage.setItem(FAV_KEY,JSON.stringify(o));}

function saveFavorite(mode){
  const name = mode==="image"?favNameImage.value:favNameVideo.value;
  if(!name) return alert("登録名を入力してください");
  const f=getFav();
  f[name]={mode,area:mode==="image"?zoomArea.value:zoomAreaVideo.value,
           var:mode==="image"?imageVar.value:videoVar.value};
  saveFav(f);
  renderFavorites();
}

function applyFavorite(name){
  // ★ 追加：現在時刻表示を必ずOFFにする
  resetAutoNow();

  const f = getFav()[name];

  if(f.mode === "image"){
    imageModeBtn.click();
    zoomArea.value = f.area;
    imageVar.value = f.var;
    populateTime();   // ← autoNow=falseなので通常選択
  }else{
    videoModeBtn.click();
    zoomAreaVideo.value = f.area;
    videoVar.value = f.var;
    updateVideo();
  }
}


function requestDelete(name){
  deleteTargetName=name;
  deleteModal.style.display="flex";
}
function closeDeleteModal(){
  deleteTargetName=null;
  deleteModal.style.display="none";
}
function confirmDelete(){
  if(deleteTargetName){
    const f=getFav();
    delete f[deleteTargetName];
    saveFav(f);
    renderFavorites();
  }
  closeDeleteModal();
}

function renderFavorites(){
  const box=favoritePageList;
  box.innerHTML="";
  const f=getFav();
  for(const k in f){
    const d=document.createElement("div");
    d.className="favorite-item";
    d.innerHTML=`${k}
      <button onclick="applyFavorite('${k}')">表示</button>
      <button onclick="requestDelete('${k}')">削除</button>`;
    box.appendChild(d);
  }
}

/* ================== 矢印ON/OFF ================== */
const toggleCheckbox = document.getElementById("togglePosition");
toggleCheckbox.onchange = () => {
  const disp = toggleCheckbox.checked ? "block" : "none";
  positionMarker.style.display = disp;
  directionArrow.style.display = disp;
};
 
 
/* ================== 現在地・方位 ================== */
function updateMarker(lat, lon){
  if(!imageLoaded) return;

  requestAnimationFrame(() => {
    const r = getCurrentLatLonRange();
    const rect = displayImage.getBoundingClientRect();

    if(rect.width === 0 || rect.height === 0) return;

    positionOverlay.style.width  = rect.width + "px";
    positionOverlay.style.height = rect.height + "px";

    if(!isInside(lat, lon)){
      positionMarker.style.display = "block";
      directionArrow.style.display = "block";
      return;
    }

    const x = (lon - r.lon_left) / (r.lon_right - r.lon_left) * rect.width;
    const y = (r.lat_top - lat) / (r.lat_top - r.lat_bottom) * rect.height;

    positionMarker.style.display = "block";
    directionArrow.style.display = "block";
    positionMarker.style.left = x + "px";
    positionMarker.style.top  = y + "px";
    directionArrow.style.left = x + "px";
    directionArrow.style.top  = y + "px";
  });
}

function initOrientation() {
  // iOS 対応
  if (
    typeof DeviceOrientationEvent !== "undefined" &&
    typeof DeviceOrientationEvent.requestPermission === "function"
  ) {
    // ユーザー操作が必要
    document.body.addEventListener("click", () => {
      DeviceOrientationEvent.requestPermission()
        .then(state => {
          if (state === "granted") {
            window.addEventListener("deviceorientation", handleOrientation);
          }
        })
        .catch(console.error);
    }, { once: true });

  } else {
    // Android / PC
    window.addEventListener("deviceorientation", handleOrientation);
  }
}

function handleOrientation(e) {
  if (e.alpha === null) return;

  // alpha は時計回りなので符号反転
  currentHeading = e.alpha;

  directionArrow.style.transform =
    `rotate(${-currentHeading}deg)`;
}

 
/* ===== 画像ロード後に再計算 ===== */
displayImage.onload = () => {
  imageLoaded = true;

  if(lastLat !== null && lastLon !== null){
    // ★ 1フレームではなく 2フレーム待つ
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        updateMarker(lastLat, lastLon);
      });
    });
  }
};


/* ================== GPS ================== */
navigator.geolocation.watchPosition(p=>{
  lastLat = p.coords.latitude;
  lastLon = p.coords.longitude;
  updateMarker(lastLat, lastLon);
});

  /* ================== 方位 ================== */
window.addEventListener("resize", () => {
  if(lastLat !== null && lastLon !== null){
    updateMarker(lastLat, lastLon);
  }
});

 
/* ================== 問い合わせ ================== */
contactBtn.onclick=()=>{
  const body=encodeURIComponent("問い合わせ内容：\n\n本ページに対する要望等：\n");
  location.href=`mailto:oceanloversy@gmail.com?subject=UCHI_AWBに関する問い合わせ&body=${body}`;
};

loadJSON();
initOrientation();
</script>
</body>
</html>
