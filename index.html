<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PREDICTION of SEA CONDITION AROUND WAKASA BAY by UCHI</title>

<style>
body {
  font-family: "Segoe UI", Arial, sans-serif;
  background-color: #f8f9fa;
  margin: 0;
  text-align: center;
}
header {
  background: linear-gradient(90deg, #004e92, #000428);
  color: white;
  padding: 1.2rem;
  font-size: 1.4rem;
  font-weight: bold;
}

#wholeArea {
  display: flex;
  justify-content: center;
  margin: 1rem 0;
}
#wholeArea img {
  width: 75%;
  max-width: 800px;
  border: 2px solid #ccc;
  border-radius: 10px;
}

/* ===== 縺頑ｰ励↓蜈･繧翫・繝ｼ繧ｸ ===== */
#favoritePage {
  max-width: 900px;
  margin: 0 auto 1.5rem auto;
  background: #fffbe6;
  border: 2px solid #f0c000;
  border-radius: 10px;
  padding: 1rem;
}
#favoritePage h2 {
  margin: 0.5rem 0 1rem 0;
  font-size: 1.3rem;
}
.favorite-item {
  margin: 0.4rem 0;
}
.favorite-item button {
  margin-left: 0.5rem;
}

/* ===== 蜈ｱ騾・===== */
.container {
  margin: 1.5rem auto;
  width: 95%;
  max-width: 900px;
}
select, button, input {
  margin: 0.4rem;
  padding: 0.4rem;
  font-size: 1rem;
}
img, video {
  width: 100%;
  max-height: 80vh;
  border: 2px solid #ccc;
  border-radius: 10px;
  background: white;
}
.btn-group {
  display: flex;
  justify-content: center;
  gap: 1rem;
  margin-top: 0.8rem;
}
#mode-buttons button {
  background-color: #007bff;
  color: white;
  border: none;
  border-radius: 6px;
  padding: 0.6rem 1rem;
  cursor: pointer;
}
#mode-buttons button.active {
  background-color: #0056b3;
}

/* ===== 繝輔ャ繧ｿ繝ｼ ===== */
footer {
  margin-top: 2rem;
  background-color: #e9ecef;
  color: #555;
  font-size: 0.9rem;
  padding: 0.8rem;
  border-top: 1px solid #ccc;
}
#contactBtn {
  background-color: #007bff;
  color: white;
  padding: 0.5rem 1rem;
  border-radius: 6px;
  text-decoration: none;
}
</style>
</head>

<body>
<header>PREDICTION of <br>SEA CONDITION by UCHI<br>AROUND WAKASA BAY</header>

<div id="wholeArea">
  <img src="images/WholeArea.png">
</div>

<!-- 笘・・笘・・笘・縺頑ｰ励↓蜈･繧翫・繝ｼ繧ｸ 笘・・笘・・笘・-->
<div id="favoritePage">
  <h3>箝・縺頑ｰ励↓蜈･繧翫・繝ｼ繧ｸ 箝・/h2>
  <div id="favoritePageList"></div>
</div>

<div class="container">

<!-- ===== 繝｢繝ｼ繝牙・譖ｿ ===== -->
<div id="mode-buttons">
  <button id="imageModeBtn" class="active">髱呎ｭ｢逕ｻ</button>
  <button id="videoModeBtn">蜍慕判</button>
</div>

<!-- ================= 髱呎ｭ｢逕ｻ ================= -->
<div id="imageMode">
  <label>繧ｨ繝ｪ繧｢・・/label>
  <select id="zoomArea"></select><br>

  <label>鬆・岼・・/label>
  <select id="imageVar">
    <option value="SST">10m-Temperature</option>
    <option value="BT">30m-Temperature</option>
    <option value="SSS">10m-Salinity</option>
    <option value="BS">30m-Salinity</option>
    <option value="SVel">10m-Current</option>
    <option value="BVel">30m-Current</option>
  </select><br>

  <label>譌･譎ゑｼ・/label>
  <select id="imageTime"></select>

  <div class="btn-group">
    <button id="prevBtn">PREV</button>
    <button id="nextBtn">NEXT</button>
  </div>

  <img id="displayImage">

  <div>
    <input id="favNameImage" placeholder="險ｭ險亥錐">
    <button onclick="saveFavorite('image')">縺頑ｰ励↓蜈･繧顔匳骭ｲ</button>
  </div>
</div>

<!-- ================= 蜍慕判 ================= -->
<div id="videoMode" style="display:none;">
  <label>繧ｨ繝ｪ繧｢・・/label>
  <select id="zoomAreaVideo"></select><br>

  <label>鬆・岼・・/label>
  <select id="videoVar">
    <option value="SST">10m-Temperature</option>
    <option value="BT">30m-Temperature</option>
    <option value="SSS">10m-Salinity</option>
    <option value="BS">30m-Salinity</option>
    <option value="SVel">10m-Current</option>
    <option value="BVel">30m-Current</option>
  </select>

  <video id="displayVideo" controls></video>

  <div>
    <input id="favNameVideo" placeholder="險ｭ險亥錐">
    <button onclick="saveFavorite('video')">縺頑ｰ励↓蜈･繧顔匳骭ｲ</button>
  </div>
</div>

</div>

<footer>
<p>蠖謎ｺ域ｸｬ邨先棡繧剃ｽｿ逕ｨ縺吶ｋ縺薙→縺ｫ繧医▲縺ｦ逋ｺ逕溘＠縺滉ｸ蛻・・謳榊ｮｳ縺ｫ縺､縺・※縲∽ｽ慕ｭ芽ｲｬ莉ｻ繧定ｲ縺・∪縺帙ｓ縲・/p>
<a id="contactBtn" href="#">縺雁撫縺・粋繧上○縺ｯ縺薙■繧・/a>
</footer>

<script>
let imageData = {}, videoData = {};
const FAV_KEY = "uchi_favorites";

/* ===== JSON ===== */
async function loadJSON(){
  imageData = await (await fetch("image_list.json",{cache:"no-store"})).json();
  videoData = await (await fetch("video_list.json",{cache:"no-store"})).json();
  initUI();
}

/* ===== UI ===== */
function initUI(){
  zoomArea.innerHTML = zoomAreaVideo.innerHTML =
    Object.keys(imageData).map(a=>`<option>${a}</option>`).join("");
  populateTime();
  renderFavorites();
}

/* ===== 髱呎ｭ｢逕ｻ ===== */
function populateTime(){
  const a=zoomArea.value,v=imageVar.value;
  imageTime.innerHTML="";
  imageData[a][v].forEach(e=>{
    imageTime.innerHTML+=`<option value="${e.path}">${e.datetime}</option>`;
  });
  displayImage.src=imageTime.value;
}
prevBtn.onclick=()=>shift(-1);
nextBtn.onclick=()=>shift(1);
function shift(d){
  const i=imageTime.selectedIndex+d;
  if(i>=0 && i<imageTime.options.length){
    imageTime.selectedIndex=i;
    displayImage.src=imageTime.value;
  }
}
imageVar.onchange=populateTime;
zoomArea.onchange=populateTime;
imageTime.onchange=()=>displayImage.src=imageTime.value;

/* ===== 蜍慕判 ===== */
function updateVideo(){
  const a=zoomAreaVideo.value,v=videoVar.value;
  displayVideo.src=videoData[a][v][0].path;
}
videoVar.onchange=updateVideo;
zoomAreaVideo.onchange=updateVideo;

/* ===== 繝｢繝ｼ繝・===== */
imageModeBtn.onclick=()=>{
  imageMode.style.display="block";
  videoMode.style.display="none";
  imageModeBtn.classList.add("active");
  videoModeBtn.classList.remove("active");
};
videoModeBtn.onclick=()=>{
  imageMode.style.display="none";
  videoMode.style.display="block";
  videoModeBtn.classList.add("active");
  imageModeBtn.classList.remove("active");
};

/* ===== 縺頑ｰ励↓蜈･繧・===== */
function getFav(){ return JSON.parse(localStorage.getItem(FAV_KEY)||"{}"); }
function saveFav(o){ localStorage.setItem(FAV_KEY,JSON.stringify(o)); }

function saveFavorite(mode){
  const name = mode==="image"?favNameImage.value:favNameVideo.value;
  if(!name) return alert("險ｭ險亥錐繧貞・蜉帙＠縺ｦ縺上□縺輔＞");
  const fav=getFav();
  fav[name]={
    mode:mode,
    area: mode==="image"?zoomArea.value:zoomAreaVideo.value,
    var: mode==="image"?imageVar.value:videoVar.value
  };
  saveFav(fav);
  renderFavorites();
}

function applyFavorite(name){
  const f=getFav()[name];
  if(f.mode==="image"){
    imageModeBtn.click();
    zoomArea.value=f.area;
    imageVar.value=f.var;
    populateTime();   // 譌･譎ゅ・ PREV/NEXT 縺ｫ螳悟・霑ｽ蠕・
  }else{
    videoModeBtn.click();
    zoomAreaVideo.value=f.area;
    videoVar.value=f.var;
    updateVideo();
  }
}

function deleteFavorite(name){
  const f=getFav();
  delete f[name];
  saveFav(f);
  renderFavorites();
}

function renderFavorites(){
  const box=document.getElementById("favoritePageList");
  box.innerHTML="";
  const f=getFav();
  for(const k in f){
    const div=document.createElement("div");
    div.className="favorite-item";
    div.innerHTML=`${k}
      <button onclick="applyFavorite('${k}')">陦ｨ遉ｺ</button>
      <button onclick="deleteFavorite('${k}')">蜑企勁</button>`;
    box.appendChild(div);
  }
}

/* ===== 蝠上＞蜷医ｏ縺・===== */
contactBtn.onclick=()=>{
  location.href="mailto:oceanloversy@gmail.com?subject=UCHI蝠上＞蜷医ｏ縺・;
};

loadJSON();
</script>
</body>
</html>
