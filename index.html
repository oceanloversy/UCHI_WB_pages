<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PREDICTION of SEA CONDITION AROUND WAKASA BAY by UCHI</title>

<style>
body {
  font-family: "Segoe UI", Arial, sans-serif;
  background-color: #f8f9fa;
  margin: 0;
  text-align: center;
}
header {
  background: linear-gradient(90deg, #004e92, #000428);
  color: white;
  padding: 1.2rem;
  font-size: 1.4rem;
  font-weight: bold;
}

#wholeArea img {
  width: 75%;
  max-width: 800px;
  border: 2px solid #ccc;
  border-radius: 10px;
}

/* ===== お気に入りページ ===== */
#favoritePage {
  margin: 1.2rem auto;
  width: 95%;
  max-width: 900px;
  border: 2px solid #ffc107;
  border-radius: 10px;
  background: #fffbea;
  padding: 1rem;
}
#favoritePage h2 {
  color: #f0ad00;
  margin-bottom: 0.6rem;
}
.favorite-item {
  margin: 0.4rem 0;
}
.favorite-item select, .favorite-item input {
  font-size: 0.9rem;
}
.favorite-item button {
  margin-left: 0.3rem;
}

/* ===== コンテナ ===== */
.container {
  margin: 1.5rem auto;
  width: 95%;
  max-width: 900px;
}

select, button, input {
  margin: 0.4rem;
  padding: 0.4rem;
  font-size: 1rem;
}

img, video {
  width: 100%;
  max-height: 80vh;
  border: 2px solid #ccc;
  border-radius: 10px;
}

.btn-group {
  display: flex;
  justify-content: center;
  gap: 1rem;
}

#mode-buttons button {
  background-color: #007bff;
  color: white;
  border: none;
  border-radius: 6px;
  padding: 0.6rem 1rem;
}
#mode-buttons button.active {
  background-color: #0056b3;
}

/* ===== 登録欄 ===== */
.favorite-box h4 {
  font-size: 0.9rem;
  margin: 0.4rem;
}

/* ===== モーダル ===== */
#modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
}
#modalContent {
  background: white;
  padding: 1rem;
  width: 300px;
  margin: 20% auto;
  border-radius: 8px;
}

/* ===== フッター ===== */
footer {
  margin-top: 2rem;
  background-color: #e9ecef;
  padding: 0.8rem;
}
#contactBtn {
  background-color: #007bff;
  color: white;
  padding: 0.5rem 1rem;
  border-radius: 6px;
  text-decoration: none;
}
</style>
</head>

<body>
<header>PREDICTION of SEA CONDITION by UCHI<br>AROUND WAKASA BAY</header>

<div id="wholeArea">
  <img src="images/WholeArea.png">
</div>

<!-- ★ お気に入りページ ★ -->
<div id="favoritePage">
  <h2>★ お気に入りページ ★</h2>
  <div id="favoriteList"></div>
</div>

<div class="container">

<div id="mode-buttons">
  <button id="imageModeBtn" class="active">静止画</button>
  <button id="videoModeBtn">動画</button>
</div>

<!-- ===== 静止画 ===== -->
<div id="imageMode">
  <select id="zoomArea"></select>
  <select id="imageVar"></select>
  <select id="imageTime"></select>

  <div class="btn-group">
    <button id="prevBtn">PREV</button>
    <button id="nextBtn">NEXT</button>
  </div>

  <img id="displayImage">

  <div class="favorite-box">
    <h4>★ お気に入り登録（静止画） ★</h4>
    <input id="favNameImage" placeholder="登録名">
    <button onclick="saveFavorite('image')">登録</button>
  </div>
</div>

<!-- ===== 動画 ===== -->
<div id="videoMode" style="display:none;">
  <select id="zoomAreaVideo"></select>
  <select id="videoVar"></select>

  <video id="displayVideo" controls></video>

  <div class="favorite-box">
    <h4>★ お気に入り登録（動画） ★</h4>
    <input id="favNameVideo" placeholder="登録名">
    <button onclick="saveFavorite('video')">登録</button>
  </div>
</div>

</div>

<!-- 削除確認モーダル -->
<div id="modal">
  <div id="modalContent">
    <p>本当に削除しますか？</p>
    <button onclick="confirmDelete()">はい</button>
    <button onclick="closeModal()">キャンセル</button>
  </div>
</div>

<footer>
<p>当予測結果を使用することによって発生した一切の損害について、何等責任を負いません。</p>
<a id="contactBtn" href="#">お問い合わせはこちら</a>
</footer>

<script>
const FAV_KEY="uchi_favorites";
let delTarget=null;

function getFav(){return JSON.parse(localStorage.getItem(FAV_KEY)||"{}")}
function saveFav(o){localStorage.setItem(FAV_KEY,JSON.stringify(o));renderFavorites();}

function saveFavorite(mode){
  const name=mode==="image"?favNameImage.value:favNameVideo.value;
  if(!name) return;
  const f=getFav();
  f[name]={mode,area:mode==="image"?zoomArea.value:zoomAreaVideo.value,var:mode==="image"?imageVar.value:videoVar.value};
  saveFav(f);
}

function renderFavorites(){
  favoriteList.innerHTML="";
  const f=getFav();
  for(const k in f){
    const d=document.createElement("div");
    d.className="favorite-item";
    d.innerHTML=`
      <input value="${k}" onchange="renameFav('${k}',this.value)">
      <select onchange="updateFav('${k}','area',this.value)">${options()}</select>
      <select onchange="updateFav('${k}','var',this.value)">${varOptions()}</select>
      <button onclick="applyFavorite('${k}')">表示</button>
      <button onclick="askDelete('${k}')">削除</button>`;
    favoriteList.appendChild(d);
  }
}

function applyFavorite(name){
  const f=getFav()[name];
  if(f.mode==="image"){
    imageModeBtn.click();
    zoomArea.value=f.area; imageVar.value=f.var;
    populateTime();
  }else{
    videoModeBtn.click();
    zoomAreaVideo.value=f.area; videoVar.value=f.var;
    updateVideo();
  }
}

function renameFav(oldn,newn){
  const f=getFav(); f[newn]=f[oldn]; delete f[oldn]; saveFav(f);
}
function updateFav(n,k,v){const f=getFav(); f[n][k]=v; saveFav(f);}

function askDelete(n){delTarget=n; modal.style.display="block";}
function confirmDelete(){const f=getFav(); delete f[delTarget]; saveFav(f); closeModal();}
function closeModal(){modal.style.display="none";}

contactBtn.onclick=()=>{
  location.href="mailto:oceanloversy@gmail.com?subject=UCHI_AWBに関する問い合わせ&body=問い合わせ内容：%0A%0A本ページに関する要望等：";
};
</script>
</body>
</html>
