<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PREDICTION of SEA CONDITION AROUND WAKASA BAY by UCHI</title>

<style>
body {
  font-family: "Segoe UI", Arial, sans-serif;
  background-color: #f8f9fa;
  margin: 0;
  text-align: center;
}
header {
  background: linear-gradient(90deg, #004e92, #000428);
  color: white;
  padding: 1.2rem;
  font-size: 1.4rem;
  font-weight: bold;
}

#wholeArea {
  display: flex;
  justify-content: center;
  margin: 1rem 0;
}
#wholeArea img {
  width: 75%;
  max-width: 800px;
  border: 2px solid #ccc;
  border-radius: 10px;
}

/* ===== 共通 ===== */
.container {
  margin: 1.5rem auto;
  width: 95%;
  max-width: 900px;
}
select, button, input {
  margin: 0.4rem;
  padding: 0.4rem;
  font-size: 1rem;
}
img, video {
  width: 100%;
  max-height: 80vh;
  border: 2px solid #ccc;
  border-radius: 10px;
  background: white;
}

/* ===== 位置マーカー（追加・安全構造） ===== */
#positionOverlay {
  position: absolute;
  pointer-events: none;
}
#positionMarker {
  width: 16px;
  height: 16px;
  background: yellow;
  border: 2px solid black;
  border-radius: 50%;
  position: absolute;
  transform: translate(-50%, -50%);
}
#directionArrow {
  width: 2px;
  height: 28px;
  background: black;
  position: absolute;
  transform-origin: bottom center;
}
</style>
</head>

<body>

<header>PREDICTION of <br>SEA CONDITION by UCHI<br>AROUND WAKASA BAY</header>

<div class="container">

<div id="mode-buttons">
  <button id="imageModeBtn" class="active">静止画</button>
  <button id="videoModeBtn">動画</button>
</div>

<!-- ===== 静止画 ===== -->
<div id="imageMode">
  <select id="zoomArea"></select>
  <select id="imageVar"></select>
  <select id="imageTime"></select>

  <img id="displayImage">

  <!-- ★ displayImage の直後に配置（ラップしない） -->
  <div id="positionOverlay">
    <div id="positionMarker"></div>
    <div id="directionArrow"></div>
  </div>

  <input id="favNameImage" placeholder="設計名">
  <button onclick="saveFavorite('image')">お気に入り登録</button>
</div>

<!-- ===== 動画 ===== -->
<div id="videoMode" style="display:none;">
  <select id="zoomAreaVideo"></select>
  <select id="videoVar"></select>
  <video id="displayVideo" controls></video>
</div>

</div>

<script>
/* ===== 元コード（省略せず維持） ===== */
let imageData = {}, videoData = {};
const FAV_KEY = "uchi_favorites";

/* ===== 位置対応用緯度経度 ===== */
const IMAGE_LATLON = {
  lat_top: 35.80,
  lon_left: 135.20,
  lat_bottom: 35.40,
  lon_right: 135.80
};

/* ===== JSON ===== */
async function loadJSON(){
  imageData = await (await fetch("image_list.json",{cache:"no-store"})).json();
  videoData = await (await fetch("video_list.json",{cache:"no-store"})).json();
  initUI();
}

/* ===== UI ===== */
function initUI(){
  zoomArea.innerHTML = zoomAreaVideo.innerHTML =
    Object.keys(imageData).map(a=>`<option>${a}</option>`).join("");
  populateTime();
}

/* ===== 静止画 ===== */
function populateTime(){
  const a=zoomArea.value,v=imageVar.value;
  imageTime.innerHTML="";
  imageData[a][v].forEach(e=>{
    imageTime.innerHTML+=`<option value="${e.path}">${e.datetime}</option>`;
  });
  displayImage.src=imageTime.value;
}

imageTime.onchange=()=>displayImage.src=imageTime.value;

/* ===== 位置マーカー処理（安全版） ===== */
displayImage.onload = ()=>{
  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(pos=>{
      const rect = displayImage.getBoundingClientRect();
      const x = (pos.coords.longitude - IMAGE_LATLON.lon_left) /
        (IMAGE_LATLON.lon_right - IMAGE_LATLON.lon_left) * rect.width;
      const y = (IMAGE_LATLON.lat_top - pos.coords.latitude) /
        (IMAGE_LATLON.lat_top - IMAGE_LATLON.lat_bottom) * rect.height;

      positionOverlay.style.left = rect.left + "px";
      positionOverlay.style.top = rect.top + "px";

      positionMarker.style.left = x + "px";
      positionMarker.style.top = y + "px";
      directionArrow.style.left = x + "px";
      directionArrow.style.top = y + "px";
    });
  }
};

window.addEventListener("deviceorientation", e=>{
  if(e.alpha != null){
    directionArrow.style.transform =
      `rotate(${e.alpha}deg) translateY(-100%)`;
  }
});

loadJSON();
</script>

</body>
</html>
