<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PREDICTION of SEA CONDITION AROUND WAKASA BAY by UCHI</title>

<style>
body {
  font-family: "Segoe UI", Arial, sans-serif;
  background-color: #f8f9fa;
  margin: 0;
  text-align: center;
}
header {
  background: linear-gradient(90deg, #004e92, #000428);
  color: white;
  padding: 1.2rem;
  font-size: 1.4rem;
  font-weight: bold;
}

#wholeArea {
  display: flex;
  justify-content: center;
  margin: 1rem 0;
}
#wholeArea img {
  width: 75%;
  max-width: 800px;
  border: 2px solid #ccc;
  border-radius: 10px;
}

/* ===== お気に入りページ ===== */
#favoritePage {
  max-width: 900px;
  margin: 0 auto 1.5rem auto;
  background: #fffbe6;
  border: 2px solid #f0c000;
  border-radius: 10px;
  padding: 1rem;
}
.favorite-item {
  margin: 0.4rem 0;
}
.favorite-item button {
  margin-left: 0.5rem;
}
.favorite-note {
  margin-top: 0.8rem;
  font-size: 0.85rem;
  color: #555;
}

/* ===== モーダル ===== */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.4);
  z-index: 999;
}
.modal-box {
  background: white;
  width: 90%;
  max-width: 360px;
  margin: 20vh auto;
  padding: 1.2rem;
  border-radius: 10px;
}
.modal-box p {
  margin-bottom: 1rem;
}
.modal-box button {
  margin: 0 0.4rem;
}

/* ===== 共通 ===== */
.container {
  margin: 1.5rem auto;
  width: 95%;
  max-width: 900px;
}
select, button, input {
  margin: 0.4rem;
  padding: 0.4rem;
  font-size: 1rem;
}
img, video {
  width: 100%;
  max-height: 80vh;
  border: 2px solid #ccc;
  border-radius: 10px;
  background: white;
}

/* ===== フッター ===== */
footer {
  margin-top: 2rem;
  background-color: #e9ecef;
  color: #555;
  font-size: 0.9rem;
  padding: 0.8rem;
  border-top: 1px solid #ccc;
}
#contactBtn {
  background-color: #007bff;
  color: white;
  padding: 0.5rem 1rem;
  border-radius: 6px;
  text-decoration: none;
}
</style>
</head>

<body>
<header>PREDICTION of <br>SEA CONDITION by UCHI<br>AROUND WAKASA BAY</header>

<div id="wholeArea">
  <img src="images/WholeArea.png">
</div>

<!-- ★★★★★ お気に入りページ ★★★★★ -->
<div id="favoritePage">
  <h3> お気に入りページ </h3>
  <div id="favoritePageList"></div>
  <div class="favorite-note">
    静止画/動画・エリア・項目を選択後、ページ最下部の設計名を記入してお気に入り登録ボタンを押してください
  </div>
</div>

<!-- ===== 削除確認モーダル ===== -->
<div id="deleteModal" class="modal-overlay">
  <div class="modal-box">
    <p>このお気に入りを削除してもよろしいですか？</p>
    <button onclick="executeDeleteFavorite()">削除する</button>
    <button onclick="closeDeleteModal()">キャンセル</button>
  </div>
</div>

<footer>
<p>当予測結果を使用することによって発生した一切の損害について、何等責任を負いません。</p>
<a id="contactBtn" href="#">お問い合わせはこちら</a>
</footer>

<script>
const FAV_KEY = "uchi_favorites";
let deleteTarget = null;

/* ===== お気に入り ===== */
function getFav(){ return JSON.parse(localStorage.getItem(FAV_KEY)||"{}"); }
function saveFav(o){ localStorage.setItem(FAV_KEY,JSON.stringify(o)); }

function confirmDeleteFavorite(name){
  deleteTarget = name;
  document.getElementById("deleteModal").style.display = "block";
}

function executeDeleteFavorite(){
  if(deleteTarget){
    const f = getFav();
    delete f[deleteTarget];
    saveFav(f);
    deleteTarget = null;
    renderFavorites();
  }
  closeDeleteModal();
}

function closeDeleteModal(){
  document.getElementById("deleteModal").style.display = "none";
}

function renderFavorites(){
  const box=document.getElementById("favoritePageList");
  box.innerHTML="";
  const f=getFav();
  for(const k in f){
    const div=document.createElement("div");
    div.className="favorite-item";
    div.innerHTML=`${k}
      <button onclick="applyFavorite('${k}')">表示</button>
      <button onclick="confirmDeleteFavorite('${k}')">削除</button>`;
    box.appendChild(div);
  }
}

/* ===== 問い合わせ ===== */
contactBtn.onclick=()=>{
  location.href="mailto:oceanloversy@gmail.com?subject=UCHI問い合わせ";
};

renderFavorites();
</script>
</body>
</html>
