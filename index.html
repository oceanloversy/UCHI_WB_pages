<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PREDICTION of SEA CONDITION AROUND WAKASA BAY by UCHI</title>

<style>
body {
  font-family: "Segoe UI", Arial, sans-serif;
  background-color: #f8f9fa;
  margin: 0;
  text-align: center;
}
header {
  background: linear-gradient(90deg, #004e92, #000428);
  color: white;
  padding: 1.2rem;
  font-size: 1.4rem;
  font-weight: bold;
}

#wholeArea {
  display: flex;
  justify-content: center;
  margin: 1rem 0;
}
#wholeArea img {
  width: 75%;
  max-width: 800px;
  border: 2px solid #ccc;
  border-radius: 10px;
}

/* ===== お気に入りページ ===== */
#favoritePage {
  max-width: 900px;
  margin: 0 auto 1.5rem auto;
  background: #fffbe6;
  border: 2px solid #f0c000;
  border-radius: 10px;
  padding: 1rem;
}
.favorite-item {
  margin: 0.4rem 0;
}
.favorite-item button {
  margin-left: 0.5rem;
}
.favorite-note {
  margin-top: 0.8rem;
  font-size: 0.85rem;
  color: #555;
}

/* ===== 共通 ===== */
.container {
  margin: 1.5rem auto;
  width: 95%;
  max-width: 900px;
}
select, button, input {
  margin: 0.4rem;
  padding: 0.4rem;
  font-size: 1rem;
}
img, video {
  width: 100%;
  max-height: 80vh;
  border: 2px solid #ccc;
  border-radius: 10px;
  background: white;
}
.btn-group {
  display: flex;
  justify-content: center;
  gap: 1rem;
  margin-top: 0.8rem;
}
#mode-buttons button {
  background-color: #007bff;
  color: white;
  border: none;
  border-radius: 6px;
  padding: 0.6rem 1rem;
  cursor: pointer;
}
#mode-buttons button.active {
  background-color: #0056b3;
}

/* ===== 速度注記 ===== */
.velocity-note {
  margin-top: 0.4rem;
  font-size: 0.9rem;
  color: #c00000;
  font-weight: bold;
  display: none;
}

/* ===== 位置表示 ===== */
.position-toggle {
  margin: 0.8rem 0;
}
.overlay-wrapper {
  position: relative;
}
.position-marker {
  position: absolute;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: yellow;
  border: 3px solid black;
  transform: translate(-50%, -50%);
  z-index: 10;
}
.direction-arrow {
  position: absolute;
  width: 0;
  height: 0;
  border-left: 8px solid transparent;
  border-right: 8px solid transparent;
  border-bottom: 20px solid black;
  transform-origin: 50% 100%;
  z-index: 11;
}

/* ===== フッター ===== */
footer {
  margin-top: 2rem;
  background-color: #e9ecef;
  color: #555;
  font-size: 0.9rem;
  padding: 0.8rem;
  border-top: 1px solid #ccc;
}
#contactBtn {
  background-color: #007bff;
  color: white;
  padding: 0.5rem 1rem;
  border-radius: 6px;
  text-decoration: none;
}
</style>
</head>

<body>
<header>PREDICTION of <br>&nbsp;SEA CONDITION by UCHI<br>&nbsp;&nbsp;AROUND WAKASA BAY</header>

<div id="wholeArea">
  <img src="images/WholeArea.png">
</div>

<div id="favoritePage">
  <h3> お気に入りページ </h3>
  <div id="favoritePageList"></div>
  <div class="favorite-note">
    静止画/動画・エリア・項目を選択後、最下部の設計名を記入して、お気に入り登録ボタンを押すと、ここに登録されます(複数登録可)
  </div>
</div>

<div class="container">

<div class="position-toggle">
  <label>
    <input type="checkbox" id="togglePosition">
    現在地・向きを表示
  </label>
</div>

<div id="mode-buttons">
  <button id="imageModeBtn" class="active">静止画</button>
  <button id="videoModeBtn">動画</button>
</div>

<!-- ================= 静止画 ================= -->
<div id="imageMode">
  <label>エリア：</label>
  <select id="zoomArea"></select><br>

  <label>項目：</label>
  <select id="imageVar">
    <option value="SVel">10m-Current</option>
    <option value="BVel">30m-Current</option>
    <option value="SST">10m-Temperature</option>
    <option value="BT">30m-Temperature</option>
    <option value="SSS">10m-Salinity</option>
    <option value="BS">30m-Salinity</option>
  </select><br>

  <label>日時：</label>
  <select id="imageTime"></select>

  <div class="btn-group">
    <button id="prevBtn">PREV</button>
    <button id="nextBtn">NEXT</button>
  </div>

  <div class="overlay-wrapper">
    <img id="displayImage">
    <div id="imageMarker" class="position-marker" style="display:none;"></div>
    <div id="imageArrow" class="direction-arrow" style="display:none;"></div>
  </div>

  <div id="imageVelocityNote" class="velocity-note">
    赤矢印は流速0.5m/s以上
  </div>
</div>

<!-- ================= 動画 ================= -->
<div id="videoMode" style="display:none;">
  <label>エリア：</label>
  <select id="zoomAreaVideo"></select><br>

  <label>項目：</label>
  <select id="videoVar">
    <option value="SVel">10m-Current</option>
    <option value="BVel">30m-Current</option>
    <option value="SST">10m-Temperature</option>
    <option value="BT">30m-Temperature</option>
    <option value="SSS">10m-Salinity</option>
    <option value="BS">30m-Salinity</option>
  </select>

  <div class="overlay-wrapper">
    <video id="displayVideo" controls></video>
    <div id="videoMarker" class="position-marker" style="display:none;"></div>
    <div id="videoArrow" class="direction-arrow" style="display:none;"></div>
  </div>

  <div id="videoVelocityNote" class="velocity-note">
    赤矢印は流速0.5m/s以上
  </div>
</div>

</div>

<footer>
<p>当予測結果は九州大学総合理工学研究院によるものです。</p>
<a id="contactBtn" href="#">開発者へのお問い合わせはこちら</a>
</footer>

<script>
/* ===== 各エリアの地理範囲設定 ===== */
const AREA_GEO = {
  "WholeArea": {
    nw: { lat: 36.5, lon: 134.344906 },
    se: { lat: 35.306869, lon: 136.511917 }
  }
  "Area1": {
    nw: { lat: 36.087634, lon: 134.542967 },
    se: { lat: 35.506927, lon: 135.198202 }
  }
  "Area2": {
    nw: { lat: 36.035958, lon: 134.894557 },
    se: { lat: 35.32, lon: 135.559380 }
  }
  "Area3": {
    nw: { lat: 36.245939, lon: 135.057566 },
    se: { lat: 35.33, lon: 136.125013 }
  }
};

let currentLat = null;
let currentLon = null;
let currentHeading = 0;

togglePosition.onchange = () => {
  const show = togglePosition.checked;
  imageMarker.style.display = imageArrow.style.display = show ? "block" : "none";
  videoMarker.style.display = videoArrow.style.display = show ? "block" : "none";
};

navigator.geolocation.watchPosition(pos => {
  currentLat = pos.coords.latitude;
  currentLon = pos.coords.longitude;
  updateMarkerPosition();
});

window.addEventListener("deviceorientation", e => {
  if (e.alpha != null) {
    currentHeading = e.alpha;
    updateMarkerPosition();
  }
});

function updateMarkerPosition(){
  if(currentLat == null) return;
  const area = zoomArea.value;
  const geo = AREA_GEO[area];
  if(!geo) return;

  const x = (currentLon - geo.nw.lon) / (geo.se.lon - geo.nw.lon) * 100;
  const y = (geo.nw.lat - currentLat) / (geo.nw.lat - geo.se.lat) * 100;

  [imageMarker, videoMarker].forEach(m=>{
    m.style.left = x + "%";
    m.style.top = y + "%";
  });
  [imageArrow, videoArrow].forEach(a=>{
    a.style.left = x + "%";
    a.style.top = y + "%";
    a.style.transform = `translate(-50%,-100%) rotate(${currentHeading}deg)`;
  });
}
</script>
</body>
</html>
