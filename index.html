<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PREDICTION of SEA CONDITION AROUND WAKASA BAY by UCHI</title>

<style>
body { font-family: "Segoe UI", Arial, sans-serif; background:#f8f9fa; margin:0; text-align:center; }
header { background:linear-gradient(90deg,#004e92,#000428); color:#fff; padding:1.2rem; font-size:1.4rem; font-weight:bold; }

#wholeArea img {
  width:75%; max-width:800px; border:2px solid #ccc; border-radius:10px;
}

.container { margin:1.5rem auto; width:95%; max-width:900px; }
select, button, input { margin:0.4rem; padding:0.4rem; font-size:1rem; }
img, video { width:100%; max-height:80vh; border:2px solid #ccc; border-radius:10px; background:#fff; }

.btn-group { display:flex; justify-content:center; gap:1rem; margin-top:0.8rem; }
#mode-buttons button { background:#007bff; color:#fff; border:none; border-radius:6px; padding:0.6rem 1rem; }
#mode-buttons button.active { background:#0056b3; }

/* ===== 登録ページ ===== */
#favoritePage {
  margin:1rem auto;
  padding:1rem;
  background:#ffffff;
  border:1px solid #ccc;
  border-radius:10px;
  max-width:900px;
}
.favorite-item {
  margin:0.3rem 0;
}
.favorite-item span {
  font-weight:bold;
}
.favorite-item button {
  margin-left:0.3rem;
}

/* ===== 登録フォーム ===== */
.favorite-box {
  margin-top:1rem;
  padding:0.8rem;
  border:1px solid #ccc;
  border-radius:8px;
  background:#ffffff;
}

/* ===== footer ===== */
footer {
  margin-top:2rem;
  background:#e9ecef;
  padding:0.8rem;
  font-size:0.9rem;
}
</style>
</head>

<body>

<header>
PREDICTION of <br>SEA CONDITION by UCHI<br>AROUND WAKASA BAY
</header>

<!-- ===== WholeArea ===== -->
<div id="wholeArea">
  <img src="images/WholeArea.png">
</div>

<!-- ===== 登録ページ ===== -->
<div id="favoritePage">
  <h2>登録ページ</h2>
  <div id="favoriteList"></div>
</div>

<div class="container">

<!-- ===== モード切替 ===== -->
<div id="mode-buttons">
  <button id="imageModeBtn" class="active">静止画</button>
  <button id="videoModeBtn">動画</button>
</div>

<!-- ===== 静止画 ===== -->
<div id="imageMode">
  <select id="zoomArea"></select>
  <select id="imageVar">
    <option value="SST">10m-Temperature</option>
    <option value="BT">30m-Temperature</option>
    <option value="SSS">10m-Salinity</option>
    <option value="BS">30m-Salinity</option>
    <option value="SVel">10m-Current</option>
    <option value="BVel">30m-Current</option>
  </select>
  <select id="imageTime"></select>

  <div class="btn-group">
    <button id="prevBtn">PREV</button>
    <button id="nextBtn">NEXT</button>
  </div>

  <img id="displayImage">

  <div class="favorite-box">
    <h3>お気に入り登録（静止画）</h3>
    <input id="favNameImage" placeholder="登録名">
    <button onclick="saveFavorite('image')">登録</button>
  </div>
</div>

<!-- ===== 動画 ===== -->
<div id="videoMode" style="display:none;">
  <select id="zoomAreaVideo"></select>
  <select id="videoVar">
    <option value="SST">10m-Temperature</option>
    <option value="BT">30m-Temperature</option>
    <option value="SSS">10m-Salinity</option>
    <option value="BS">30m-Salinity</option>
    <option value="SVel">10m-Current</option>
    <option value="BVel">30m-Current</option>
  </select>

  <video id="displayVideo" controls></video>

  <div class="favorite-box">
    <h3>お気に入り登録（動画）</h3>
    <input id="favNameVideo" placeholder="登録名">
    <button onclick="saveFavorite('video')">登録</button>
  </div>
</div>

</div>

<footer>
<p>当予測結果を使用することによって発生した一切の損害について、何等責任を負いません。</p>
</footer>

<script>
let imageData={}, videoData={};
const KEY="uchi_favorites";

/* ===== util ===== */
const getFav=()=>JSON.parse(localStorage.getItem(KEY)||"{}");
const saveFav=o=>localStorage.setItem(KEY,JSON.stringify(o));

/* ===== favorite ===== */
function saveFavorite(mode){
  const name = mode==="image"?favNameImage.value:favNameVideo.value;
  if(!name) return alert("登録名を入力してください");
  const f=getFav();
  f[name]={mode, area:mode==="image"?zoomArea.value:zoomAreaVideo.value,
           var:mode==="image"?imageVar.value:videoVar.value};
  saveFav(f); renderFavorites();
}

function applyFavorite(n){
  const f=getFav()[n];
  if(f.mode==="image"){
    imageModeBtn.click();
    zoomArea.value=f.area; imageVar.value=f.var; populateTime();
  }else{
    videoModeBtn.click();
    zoomAreaVideo.value=f.area; videoVar.value=f.var; updateVideo();
  }
}

function editFavorite(n){
  const f=getFav();
  const d=f[n];
  const newName=prompt("登録名",n);
  if(!newName) return;
  d.area=prompt("Area",d.area)||d.area;
  d.var=prompt("項目",d.var)||d.var;
  delete f[n];
  f[newName]=d;
  saveFav(f); renderFavorites();
}

function deleteFavorite(n){
  const f=getFav(); delete f[n]; saveFav(f); renderFavorites();
}

function renderFavorites(){
  const box=document.getElementById("favoriteList");
  box.innerHTML="";
  const f=getFav();
  for(const k in f){
    const div=document.createElement("div");
    div.className="favorite-item";
    div.innerHTML=
      `<span>${k}</span> (${f[k].mode})
       <button onclick="applyFavorite('${k}')">表示</button>
       <button onclick="editFavorite('${k}')">編集</button>
       <button onclick="deleteFavorite('${k}')">削除</button>`;
    box.appendChild(div);
  }
}

/* ===== data ===== */
async function loadJSON(){
  imageData=await (await fetch("image_list.json",{cache:"no-store"})).json();
  videoData=await (await fetch("video_list.json",{cache:"no-store"})).json();
  zoomArea.innerHTML=zoomAreaVideo.innerHTML=
    Object.keys(imageData).map(a=>`<option>${a}</option>`).join("");
  populateTime(); renderFavorites();
}

function populateTime(){
  const a=zoomArea.value,v=imageVar.value;
  imageTime.innerHTML="";
  imageData[a][v].forEach(e=>{
    imageTime.innerHTML+=`<option value="${e.path}">${e.datetime}</option>`;
  });
  displayImage.src=imageTime.value;
}
prevBtn.onclick=()=>imageTime.selectedIndex=Math.max(0,imageTime.selectedIndex-1);
nextBtn.onclick=()=>imageTime.selectedIndex=Math.min(imageTime.length-1,imageTime.selectedIndex+1);
imageTime.onchange=()=>displayImage.src=imageTime.value;
imageVar.onchange=populateTime; zoomArea.onchange=populateTime;

function updateVideo(){
  const a=zoomAreaVideo.value,v=videoVar.value;
  displayVideo.src=videoData[a][v][0].path;
}
videoVar.onchange=updateVideo; zoomAreaVideo.onchange=updateVideo;

imageModeBtn.onclick=()=>{imageMode.style.display="block";videoMode.style.display="none";};
videoModeBtn.onclick=()=>{imageMode.style.display="none";videoMode.style.display="block";};

loadJSON();
</script>
</body>
</html>
